services:
  # ----------------------------------------------------------------------------
  # 1. Local Python Embedding Service (sentence-transformers / all-MiniLM-L6-v2)
  # ----------------------------------------------------------------------------
  embedding:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: alchemist-embedding
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_MAX_BATCH=64
      - EMBEDDING_MAX_TEXT_CHARS=4000
    deploy:
      resources:
        limits:
          memory: 600M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 2. Express Backend RAG Orchestrator (Node.js 20)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alchemist-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - EMBEDDING_SERVICE_URL=http://embedding:8001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - CORS_ALLOWED_ORIGINS=*
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-5}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.30}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-20}
    depends_on:
      embedding:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 250M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. React Frontend with Nginx Web Server & Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alchemist-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 100M

networks:
  default:
    name: alchemist-network
